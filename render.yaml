services:
  - type: web
    name: salpurflask
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SECURITY_PASSWORD_SALT
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: COMPANY_NAME
        value: TradeFlow
      - key: COMPANY_TAGLINE
        value: Inventory & Accounts Management
      - key: ALLOW_SIGNUP
        value: false
      - key: ANTHROPIC_API_KEY
        sync: false
