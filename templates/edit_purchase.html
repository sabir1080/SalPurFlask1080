<!--edit_purchase.html-->

{% extends 'base.html' %}
{% block content %}
{% set form_data = form_data|default({}) %}
    <h2>Edit Purchase</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="supplier_id" class="form-label">Supplier</label>
            <select class="form-select" id="supplier_id" name="supplier_id" required>
                <option value="">Select Supplier</option>
                {% for supplier in suppliers %}
                    <option value="{{ supplier.id }}" {% if (form_data.get('supplier_id', purchase.supplier_id)|string) == (supplier.id|string) %}selected{% endif %}>{{ supplier.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="item_id" class="form-label">Item</label>
            <select class="form-select" id="item_id" name="item_id" required>
                <option value="">Select Item</option>
                {% for item in items %}
                    <option value="{{ item.id }}" {% if (form_data.get('item_id', purchase.item_id)|string) == (item.id|string) %}selected{% endif %}>{{ item.name }}{% if item.id_category %} ({{ item.id_category.name }}){% endif %}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="quantity" name="quantity" value="{{ form_data.get('quantity', purchase.quantity) }}" min="1" required>
        </div>
        <div class="mb-3">
            <label for="purchase_price" class="form-label">Purchase Price (per unit)</label>
            <input type="number" step="0.01" class="form-control" id="purchase_price" name="purchase_price" value="{{ form_data.get('purchase_price', purchase.purchase_price) }}" required>
        </div>
        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" value="{{ form_data.get('date', purchase.date.strftime('%Y-%m-%d')) }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Purchase</button>
        <a href="{{ url_for('purchase') }}" class="btn btn-secondary">Cancel</a>
    </form>
    <script>
        document.getElementById('item_id').addEventListener('change', function() {
            const itemId = this.value;
            if (itemId) {
                fetch(`/api/item/${itemId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.purchase_price !== null) {
                            document.getElementById('purchase_price').value = data.purchase_price;
                        } else {
                            document.getElementById('purchase_price').value = '';
                        }
                    });
            }
        });
    </script>
{% endblock %}
