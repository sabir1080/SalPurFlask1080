{% extends 'base.html' %}
{% block title %}Edit User — {{ user.name }}{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-title">
    <h1><i class="bi bi-person-gear"></i> Edit User</h1>
    <p>{{ user.name }}</p>
  </div>
  <div class="page-header-actions">
    <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Back to Users
    </a>
  </div>
</div>

<div class="row">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-body">
        <form method="POST">
          <div class="form-group mb-3">
            <label class="form-label required">Full Name</label>
            <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
          </div>
          <div class="form-group mb-3">
            <label class="form-label required">Email Address</label>
            <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
          </div>
          <div class="form-group mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" name="password" placeholder="Leave blank to keep current">
            <small class="form-text">Minimum 6 characters if changing password</small>
          </div>
          <div class="form-group mb-4">
            <label class="form-label required">Role</label>
            <select class="form-select" name="role" required>
              <option value="staff" {% if user.role == 'staff' %}selected{% endif %}>Staff — Add/view only</option>
              <option value="manager" {% if user.role == 'manager' %}selected{% endif %}>Manager — Add/edit all data + reports</option>
              <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin — Full access + user management</option>
            </select>
          </div>
          <div class="form-group mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="verified" value="1" id="verified" {% if user.verified %}checked{% endif %}>
              <label class="form-check-label" for="verified">
                Verified (user can log in)
              </label>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check"></i> Save Changes
            </button>
            <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
