{% extends 'base.html' %}
{% block title %}Edit User — {{ user.name }}{% endblock %}
{% block content %}

<div class="d-flex align-items-center mb-4 gap-3">
    <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back
    </a>
    <h2 class="mb-0"><i class="bi bi-person-gear"></i> Edit User</h2>
</div>

<div class="card border-0 shadow-sm" style="max-width:560px">
    <div class="card-body p-4">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">New Password <span class="text-muted fw-normal">(leave blank to keep current)</span></label>
            <input type="password" class="form-control" name="password" placeholder="Enter new password (min 6 chars)">
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <select class="form-select" name="role" required>
                <option value="staff"   {% if user.role == 'staff'   %}selected{% endif %}>Staff — Add/view transactions only</option>
                <option value="manager" {% if user.role == 'manager' %}selected{% endif %}>Manager — Add/edit all data + reports (no delete)</option>
                <option value="admin"   {% if user.role == 'admin'   %}selected{% endif %}>Admin — Full access + user management</option>
            </select>
        </div>
        <div class="mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="verified" value="1" id="verified"
                       {% if user.verified %}checked{% endif %}>
                <label class="form-check-label" for="verified">
                    Verified (user can log in)
                </label>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
                <i class="bi bi-check-lg"></i> Save Changes
            </button>
            <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
    </div>
</div>

{% endblock %}
