{% extends 'base.html' %}
{% block title %}Edit Quotation #{{ q.id }}{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-title">
    <h1><i class="bi bi-pencil-square"></i> Edit Quotation #{{ q.id }}</h1>
    <p>Customer: {{ q.customer.name }}</p>
  </div>
  <div class="page-header-actions">
    <a href="{{ url_for('quotation_detail', id=q.id) }}" class="btn btn-secondary">
      <i class="bi bi-arrow-left"></i> Back
    </a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold">Customer <span class="text-danger">*</span></label>
          <input type="hidden" id="customer_id" name="customer_id" required value="{{ q.customer_id }}">
          <button type="button" class="btn btn-outline-secondary w-100 text-start" onclick="openCustomerLookup()">
            <i class="bi bi-search"></i> <span id="customer_id_label">{{ q.customer.name if q.customer else 'Select Customer' }}</span>
          </button>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Quote Date <span class="text-danger">*</span></label>
          <input type="date" class="form-control" name="quote_date" value="{{ q.quote_date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Valid Until</label>
          <input type="date" class="form-control" name="valid_until" value="{{ q.valid_until.strftime('%Y-%m-%d') if q.valid_until else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Notes</label>
          <input type="text" class="form-control" name="notes" placeholder="Optional" value="{{ q.notes or '' }}">
        </div>
      </div>
      <!-- Items -->
      <div class="card border mb-3">
        <div class="card-header bg-light fw-semibold d-flex justify-content-between">
          <span>Items</span>
          <button type="button" class="btn btn-sm btn-outline-success" onclick="addRow()">+ Add Row</button>
        </div>
        <div class="card-body p-2">
          <div class="table-responsive">
            <table class="table table-sm mb-0">
              <thead class="table-light">
                <tr>
                  <th style="min-width:200px">Item</th>
                  <th style="width:100px">Unit</th>
                  <th style="width:80px">Qty</th>
                  <th style="width:120px">Sale Price</th>
                  <th style="width:100px">Disc Type</th>
                  <th style="width:100px">Disc Val</th>
                  <th style="width:80px">Tax %</th>
                  <th style="width:40px"></th>
                </tr>
              </thead>
              <tbody id="itemBody">
                {% for qi in q.line_items %}
                <tr>
                  <td>
                    <input type="hidden" class="item-select" name="item_id[]" required value="{{ qi.item_id }}">
                    <button type="button" class="btn btn-outline-secondary btn-sm w-100 text-start item-picker-btn" onclick="openRowItemLookup(this)">
                      <i class="bi bi-search"></i> <span class="item-picker-label">{{ qi.item.name if qi.item else 'Select Item' }}</span>
                    </button>
                  </td>
                  <td><select class="form-select form-select-sm unit-select" name="unit_id[]"></select></td>
                  <td><input type="number" min="1" class="form-control form-control-sm" name="quantity[]" value="{{ qi.quantity }}" required></td>
                  <td><input type="number" step="0.01" min="0" class="form-control form-control-sm" name="sale_price[]" value="{{ qi.sale_price }}" required></td>
                  <td>
                    <select class="form-select form-select-sm" name="discount_type[]">
                      <option value="percent" {% if qi.discount_type == 'percent' %}selected{% endif %}>%</option>
                      <option value="fixed" {% if qi.discount_type == 'fixed' %}selected{% endif %}>Fixed</option>
                    </select>
                  </td>
                  <td><input type="number" step="0.01" min="0" class="form-control form-control-sm" name="discount_value[]" value="{{ qi.discount_value }}"></td>
                  <td><input type="number" step="0.01" min="0" class="form-control form-control-sm" name="tax_percent[]" value="{{ '%.2f' | format(qi.tax_percent) }}"></td>
                  <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">x</button></td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Save Changes</button>
        <a href="{{ url_for('quotation_detail', id=q.id) }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
const DEFAULT_TAX_RATE = {{ '%.2f' | format(default_tax_rate) }};

function openCustomerLookup() {
    PartyLookup.open({
        type: "customer",
        onSelect: function (party) {
            document.getElementById('customer_id').value = party.id;
            document.getElementById('customer_id_label').textContent = party.name;
        }
    });
}

// Item selection goes through the Universal Item Lookup (static/js/item_lookup.js)
// instead of a <select> pre-populated with every item — the browser never receives
// the whole catalogue just because this page was opened. Only the chosen item's own
// unit choices are fetched (one small request per pick, not one for every item up front).
function openRowItemLookup(btn) {
    const row = btn.closest('tr');
    ItemLookup.open({
        onSelect: function (item) { applyItemToRow(row, item); }
    });
}

function applyItemToRow(row, item) {
    row.querySelector('.item-select').value = item.id;
    row.querySelector('.item-picker-label').textContent = item.name;
    fetchUnitsAndPopulate(row, item.id);
}

function fetchUnitsAndPopulate(row, itemId) {
    return fetch("/api/items/" + encodeURIComponent(itemId) + "/units")
        .then(r => r.json())
        .then(data => populateUnits(row, data.units || []))
        .catch(() => populateUnits(row, [{ key: "", name: "Pcs", factor: 1, sale_price: null }]));
}

function populateUnits(row, units) {
    const unitSel = row.querySelector('.unit-select');
    unitSel.innerHTML = '';
    units.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.key;
        opt.dataset.factor = u.factor;
        if (u.sale_price !== null && u.sale_price !== undefined) opt.dataset.price = u.sale_price;
        opt.textContent = u.name;
        unitSel.appendChild(opt);
    });
    applyUnitPrice(unitSel);
}

function applyUnitPrice(unitSel) {
    const opt = unitSel.options[unitSel.selectedIndex];
    const row = unitSel.closest('tr');
    const priceInput = row.querySelector('input[name="sale_price[]"]');
    if (opt && opt.dataset.price) priceInput.value = opt.dataset.price;
}

function addRow() {
    const tbody = document.getElementById('itemBody');
    const first = tbody.querySelector('tr');
    const clone = first.cloneNode(true);
    clone.querySelectorAll('input').forEach(i => {
        if (i.name == 'discount_value[]') i.value = '0';
        else if (i.name == 'tax_percent[]') i.value = DEFAULT_TAX_RATE;
        else if (i.classList.contains('item-select')) i.value = '';
        else i.value = '';
    });
    if(clone.querySelector('input[name="quantity[]"]')) clone.querySelector('input[name="quantity[]"]').value='1';
    clone.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
    clone.querySelector('.unit-select').innerHTML = '';
    const label = clone.querySelector('.item-picker-label');
    label.textContent = '-- Item --';
    const last = clone.querySelector('td:last-child');
    last.innerHTML = '<button type="button" class="btn btn-danger btn-sm" onclick="this.closest(\'tr\').remove()">x</button>';
    tbody.appendChild(clone);
}

document.getElementById('itemBody').addEventListener('change', function(e) {
    if (e.target.name === 'unit_id[]') {
        applyUnitPrice(e.target);
    }
});

// Initialize units for existing rows on page load — same as before migration,
// this intentionally still re-applies the item's current unit price over the
// pre-filled sale_price[] value (a pre-existing quirk of this page, not
// something this migration changes).
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('#itemBody tr').forEach(row => {
        const itemSel = row.querySelector('.item-select');
        if (itemSel && itemSel.value) {
            fetchUnitsAndPopulate(row, itemSel.value);
        }
    });
});
</script>
{% endblock %}
