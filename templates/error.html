{% extends 'base.html' %}
{% block title %}{{ code }} — {{ title }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
  <div class="text-center px-3" style="max-width: 580px;">
    <div class="error-code mb-4">{{ code }}</div>
    <h1 class="h2 fw-bold mb-3">{{ title }}</h1>
    <p class="text-muted mb-6" style="font-size: 1.1rem;">{{ message }}</p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
        <i class="bi bi-house-door"></i> Go Home
      </a>
      <a href="javascript:history.back()" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Go Back
      </a>
    </div>
  </div>
</div>

<style>
  .error-code {
    font-size: clamp(4.5rem, 14vw, 8rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1rem;
  }
</style>
{% endblock %}
