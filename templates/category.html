<!--category.html-->

{% extends 'base.html' %}
{% block content %}
{% set form_data = form_data|default({}) %}
    <h2>Manage Categories</h2>
    <form method="GET" class="mb-3">
        <div class="input-group">
            <input type="text" class="form-control" name="search" placeholder="Search by name" value="{{ search }}">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>
    <form method="POST" class="mb-4">
        <div class="mb-3">
            <label for="name" class="form-label">Category Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ form_data.get('name', '') }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Category</button>
    </form>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Items</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
                <tr>
                    <td>{{ category.id }}</td>
                    <td>{{ category.name }}</td>
                    <td>{{ category.items|length }}</td>
                    <td>
                        <a href="{{ url_for('edit_category', id=category.id) }}" class="btn btn-sm btn-warning">Edit</a>
                        <form action="{{ url_for('delete_category', id=category.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this category?')">Delete</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    {{ pagination.links }}
{% endblock %}
