{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <div class="page-header-title">
    <h1><i class="bi bi-pencil-square"></i> Edit Supplier Payment</h1>
    <p>Modify payment details</p>
  </div>
</div>

<div class="card mb-6" style="max-width: 700px;">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="supplier_id" class="form-label required">Supplier</label>
          <input type="hidden" id="supplier_id" name="supplier_id" required value="{{ payment.supplier_id }}">
          <button type="button" class="btn btn-outline-secondary w-100 text-start" onclick="openSupplierLookup()">
            <i class="bi bi-search"></i> <span id="supplier_id_label">{{ payment.supplier.name if payment.supplier else 'Select Supplier' }}</span>
          </button>
        </div>
        <div class="col-md-6">
          <label for="amount" class="form-label required">Amount</label>
          <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ payment.amount }}" required>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label for="payment_date" class="form-label required">Payment Date</label>
          <input type="date" class="form-control" id="payment_date" name="payment_date" value="{{ payment.payment_date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-4">
          <label for="payment_method" class="form-label required">Method</label>
          <select class="form-select" id="payment_method" name="payment_method" required>
            {% for method in payment_methods %}
            <option value="{{ method }}" {% if payment.payment_method == method %}selected{% endif %}>{{ method }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          {% with selected_account_id = payment.account_id %}{% include '_account_select.html' %}{% endwith %}
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="purchase_id" class="form-label">Against Purchase</label>
          <select class="form-select" id="purchase_id" name="purchase_id">
            <option value="">General / On Account</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="reference_no" class="form-label">Reference No.</label>
          <input type="text" class="form-control" id="reference_no" name="reference_no" value="{{ payment.reference_no or '' }}">
        </div>
      </div>

      <div class="mb-4">
        <label for="notes" class="form-label">Notes</label>
        <input type="text" class="form-control" id="notes" name="notes" value="{{ payment.notes or '' }}" placeholder="Optional notes">
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check"></i> Update Payment
        </button>
        <a href="{{ url_for('supplier_payment') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
const purchaseSelect = document.getElementById('purchase_id');
const currentPurchaseId = {{ (payment.purchase_id or '') | tojson }};
const editingPaymentId = {{ payment.id }};

// The dropdown is populated from the server, scoped to exactly the selected
// supplier (GET /api/supplier/<id>/outstanding-purchases) — never a
// client-side hide/show over a list that already contains every supplier's
// bills. exclude_payment_id backs this payment's own amount out of each
// purchase's paid total (matching validate_supplier_payment) and guarantees
// the purchase already saved on this payment stays in the list even if
// that leaves it fully paid, so switching away and back can't lose it.
function loadPurchases(sid) {
    purchaseSelect.querySelectorAll('option[value]:not([value=""])').forEach(function (opt) { opt.remove(); });
    purchaseSelect.value = '';
    if (!sid) return;
    fetch('/api/supplier/' + sid + '/outstanding-purchases?exclude_payment_id=' + editingPaymentId)
        .then(r => r.json())
        .then(data => {
            (data.purchases || []).forEach(function (row) {
                const opt = document.createElement('option');
                opt.value = row.id;
                opt.textContent = '#' + row.id + ' — Due: ' + Number(row.due).toLocaleString(undefined, {minimumFractionDigits: 2});
                if (String(row.id) === String(currentPurchaseId)) opt.selected = true;
                purchaseSelect.appendChild(opt);
            });
        });
}

// Supplier selection now goes through the Universal Party Lookup
// (static/js/party_lookup.js) instead of a <select> pre-populated with every
// supplier.
function openSupplierLookup() {
    PartyLookup.open({
        type: "supplier",
        onSelect: function (party) {
            document.getElementById('supplier_id').value = party.id;
            document.getElementById('supplier_id_label').textContent = party.name;
            loadPurchases(party.id);
        }
    });
}

document.addEventListener('DOMContentLoaded', function () {
    loadPurchases(document.getElementById('supplier_id').value);
});
</script>
{% endblock %}
