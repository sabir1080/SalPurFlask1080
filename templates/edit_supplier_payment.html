{% extends 'base.html' %}
{% block content %}
<h2>Edit Supplier Payment</h2>
<form method="POST" class="card card-body border">
    <div class="row g-3">
        <div class="col-md-4">
            <label for="supplier_id" class="form-label">Supplier</label>
            <select class="form-control" id="supplier_id" name="supplier_id" required>
                {% for supplier in suppliers %}
                <option value="{{ supplier.id }}" {% if payment.supplier_id == supplier.id %}selected{% endif %}>{{ supplier.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="purchase_id" class="form-label">Against Purchase (optional)</label>
            <select class="form-control" id="purchase_id" name="purchase_id">
                <option value="">General / On Account</option>
                {% for p in purchases %}
                {% set p_total = purchase_total(p) %}
                {% set p_paid = get_purchase_paid(p.id) %}
                {% if payment.purchase_id == p.id %}{% set p_paid = p_paid - payment.amount %}{% endif %}
                {% set p_due = p_total - p_paid %}
                {% if p_due > 0 or payment.purchase_id == p.id %}
                <option value="{{ p.id }}" data-supplier="{{ p.supplier_id }}" class="purchase-option" {% if payment.purchase_id == p.id %}selected{% endif %}>
                    #{{ p.id }} — {{ p.id_item.name }} — Due: {{ p_due | fmt_num }}
                </option>
                {% endif %}
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ payment.amount }}" required>
        </div>
        <div class="col-md-3">
            <label for="payment_date" class="form-label">Payment Date</label>
            <input type="date" class="form-control" id="payment_date" name="payment_date" value="{{ payment.payment_date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-3">
            <label for="payment_method" class="form-label">Method</label>
            <select class="form-control" id="payment_method" name="payment_method" required>
                {% for method in payment_methods %}
                <option value="{{ method }}" {% if payment.payment_method == method %}selected{% endif %}>{{ method }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label for="reference_no" class="form-label">Reference No.</label>
            <input type="text" class="form-control" id="reference_no" name="reference_no" value="{{ payment.reference_no or '' }}">
        </div>
        <div class="col-md-3">
            <label for="notes" class="form-label">Notes</label>
            <input type="text" class="form-control" id="notes" name="notes" value="{{ payment.notes or '' }}">
        </div>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Update Payment</button>
        <a href="{{ url_for('supplier_payment') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const supplierSelect = document.getElementById('supplier_id');
    const purchaseSelect = document.getElementById('purchase_id');
    function filterPurchases() {
        const sid = supplierSelect.value;
        purchaseSelect.querySelectorAll('.purchase-option').forEach(function (opt) {
            opt.hidden = sid && opt.dataset.supplier !== sid;
        });
    }
    supplierSelect.addEventListener('change', filterPurchases);
    filterPurchases();
});
</script>
{% endblock %}
