{% macro sort_th(label, key, current_sort, current_dir, endpoint, extra_args={}, cell_class='') %}
{% set next_dir = 'desc' if (current_sort == key and current_dir == 'asc') else 'asc' %}
<th class="sortable-col {{ cell_class }}" style="cursor: pointer;">
  <a href="{{ url_for(endpoint, **dict(extra_args, sort=key, dir=next_dir)) }}"
     class="text-decoration-none text-reset d-inline-flex align-items-center gap-1">
    {{ label }}
    {% if current_sort == key %}
      <i class="bi bi-caret-{{ 'up' if current_dir == 'asc' else 'down' }}-fill" style="font-size: 0.7em;"></i>
    {% else %}
      <i class="bi bi-arrow-down-up text-tertiary" style="font-size: 0.7em; opacity: 0.5;"></i>
    {% endif %}
  </a>
</th>
{% endmacro %}
