<!DOCTYPE html>
<html>
<head>
    <title>Resend Verification Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Resend Verification Email</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% set form_data = form_data|default({}) %}
        <form method="POST" action="{{ url_for('auth.resend_verification') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ form_data.get('email', '') }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Resend Verification Email</button>
        </form>
        <p class="mt-3"><a href="{{ url_for('auth.signin') }}">Back to Sign In</a></p>
    </div>
</body>
</html>
