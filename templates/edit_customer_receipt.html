{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <div class="page-header-title">
    <h1><i class="bi bi-pencil-square"></i> Edit Customer Receipt</h1>
    <p>Modify receipt details</p>
  </div>
</div>

<div class="card mb-6" style="max-width: 700px;">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="customer_id" class="form-label required">Customer</label>
          <input type="hidden" id="customer_id" name="customer_id" required value="{{ receipt.customer_id }}">
          <button type="button" class="btn btn-outline-secondary w-100 text-start" onclick="openCustomerLookup()">
            <i class="bi bi-search"></i> <span id="customer_id_label">{{ receipt.customer.name if receipt.customer else 'Select Customer' }}</span>
          </button>
        </div>
        <div class="col-md-6">
          <label for="amount" class="form-label required">Amount</label>
          <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ receipt.amount }}" required>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label for="payment_date" class="form-label required">Receipt Date</label>
          <input type="date" class="form-control" id="payment_date" name="payment_date" value="{{ receipt.payment_date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-4">
          <label for="payment_method" class="form-label required">Method</label>
          <select class="form-select" id="payment_method" name="payment_method" required>
            {% for method in payment_methods %}
            <option value="{{ method }}" {% if receipt.payment_method == method %}selected{% endif %}>{{ method }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          {% with selected_account_id = receipt.account_id %}{% include '_account_select.html' %}{% endwith %}
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="sale_id" class="form-label">Against Sale</label>
          <select class="form-select" id="sale_id" name="sale_id">
            <option value="">General / On Account</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="reference_no" class="form-label">Reference No.</label>
          <input type="text" class="form-control" id="reference_no" name="reference_no" value="{{ receipt.reference_no or '' }}">
        </div>
      </div>

      <div class="mb-4">
        <label for="notes" class="form-label">Notes</label>
        <input type="text" class="form-control" id="notes" name="notes" value="{{ receipt.notes or '' }}" placeholder="Optional notes">
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check"></i> Update Receipt
        </button>
        <a href="{{ url_for('customer_receipt') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
const saleSelect = document.getElementById('sale_id');
const currentSaleId = {{ (receipt.sale_id or '') | tojson }};
const editingReceiptId = {{ receipt.id }};

// The dropdown is populated from the server, scoped to exactly the selected
// customer (GET /api/customer/<id>/outstanding-sales) — never a
// client-side hide/show over a list that already contains every customer's
// invoices. exclude_receipt_id backs this receipt's own amount out of each
// sale's received total (matching validate_customer_receipt) and guarantees
// the sale already saved on this receipt stays in the list even if that
// leaves it fully received, so switching away and back can't lose it.
function loadSales(cid) {
    saleSelect.querySelectorAll('option[value]:not([value=""])').forEach(function (opt) { opt.remove(); });
    saleSelect.value = '';
    if (!cid) return;
    fetch('/api/customer/' + cid + '/outstanding-sales?exclude_receipt_id=' + editingReceiptId)
        .then(r => r.json())
        .then(data => {
            (data.sales || []).forEach(function (row) {
                const opt = document.createElement('option');
                opt.value = row.id;
                opt.textContent = '#' + row.id + ' — Due: ' + Number(row.due).toLocaleString(undefined, {minimumFractionDigits: 2});
                if (String(row.id) === String(currentSaleId)) opt.selected = true;
                saleSelect.appendChild(opt);
            });
        });
}

// Customer selection now goes through the Universal Party Lookup
// (static/js/party_lookup.js) instead of a <select> pre-populated with every
// customer.
function openCustomerLookup() {
    PartyLookup.open({
        type: "customer",
        onSelect: function (party) {
            document.getElementById('customer_id').value = party.id;
            document.getElementById('customer_id_label').textContent = party.name;
            loadSales(party.id);
        }
    });
}

document.addEventListener('DOMContentLoaded', function () {
    loadSales(document.getElementById('customer_id').value);
});
</script>
{% endblock %}
