{% extends 'base.html' %}
{% block content %}
<h2>Edit Customer Receipt</h2>
<form method="POST" class="card card-body border">
    <div class="row g-3">
        <div class="col-md-4">
            <label for="customer_id" class="form-label">Customer</label>
            <select class="form-control" id="customer_id" name="customer_id" required>
                {% for customer in customers %}
                <option value="{{ customer.id }}" {% if receipt.customer_id == customer.id %}selected{% endif %}>{{ customer.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="sale_id" class="form-label">Against Sale (optional)</label>
            <select class="form-control" id="sale_id" name="sale_id">
                <option value="">General / On Account</option>
                {% for s in sales %}
                {% set s_total = sale_total(s) %}
                {% set s_received = get_sale_received(s.id) %}
                {% if receipt.sale_id == s.id %}{% set s_received = s_received - receipt.amount %}{% endif %}
                {% set s_due = s_total - s_received %}
                {% if s_due > 0 or receipt.sale_id == s.id %}
                <option value="{{ s.id }}" data-customer="{{ s.customer_id }}" class="sale-option" {% if receipt.sale_id == s.id %}selected{% endif %}>
                    #{{ s.id }} — {{ s.id_item.name }} — Due: {{ s_due | fmt_num }}
                </option>
                {% endif %}
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ receipt.amount }}" required>
        </div>
        <div class="col-md-3">
            <label for="payment_date" class="form-label">Receipt Date</label>
            <input type="date" class="form-control" id="payment_date" name="payment_date" value="{{ receipt.payment_date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-3">
            <label for="payment_method" class="form-label">Method</label>
            <select class="form-control" id="payment_method" name="payment_method" required>
                {% for method in payment_methods %}
                <option value="{{ method }}" {% if receipt.payment_method == method %}selected{% endif %}>{{ method }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            {% with selected_account_id = receipt.account_id %}{% include '_account_select.html' %}{% endwith %}
        </div>
        <div class="col-md-3">
            <label for="reference_no" class="form-label">Reference No.</label>
            <input type="text" class="form-control" id="reference_no" name="reference_no" value="{{ receipt.reference_no or '' }}">
        </div>
        <div class="col-md-3">
            <label for="notes" class="form-label">Notes</label>
            <input type="text" class="form-control" id="notes" name="notes" value="{{ receipt.notes or '' }}">
        </div>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Update Receipt</button>
        <a href="{{ url_for('customer_receipt') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const customerSelect = document.getElementById('customer_id');
    const saleSelect = document.getElementById('sale_id');
    function filterSales() {
        const cid = customerSelect.value;
        saleSelect.querySelectorAll('.sale-option').forEach(function (opt) {
            opt.hidden = cid && opt.dataset.customer !== cid;
        });
    }
    customerSelect.addEventListener('change', filterSales);
    filterSales();
});
</script>
{% endblock %}
