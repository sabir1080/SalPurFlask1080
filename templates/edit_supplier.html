<!--edit_supplier.html-->



{% extends 'base.html' %}

{% block content %}

    <h2>Edit Supplier</h2>

    <form method="POST" class="mb-4">

        <div class="mb-3">

            <label for="name" class="form-label">Name</label>

            <input type="text" class="form-control" id="name" name="name" value="{{ supplier.name }}" required>

        </div>

        <div class="mb-3">

            <label for="contact" class="form-label">Contact</label>

            <input type="text" class="form-control" id="contact" name="contact" value="{{ supplier.contact }}" required>

        </div>

        <div class="mb-3">

            <label for="address" class="form-label">Address</label>

            <input type="text" class="form-control" id="address" name="address" value="{{ supplier.address }}" required>

        </div>

        <div class="mb-3">

            <label for="opening_balance" class="form-label">Opening Balance</label>

            <input type="number" step="0.01" class="form-control" id="opening_balance" name="opening_balance" value="{{ supplier.opening_balance or 0 }}">

            <small class="text-muted">Positive = payable | Negative = advance paid</small>

        </div>

        <a href="{{ url_for('supplier_ledger', id=supplier.id) }}" class="btn btn-info mb-3">View Full Ledger</a>

        <div>

            <button type="submit" class="btn btn-primary">Update Supplier</button>

            <a href="{{ url_for('supplier') }}" class="btn btn-secondary">Cancel</a>

        </div>

    </form>

{% endblock %}
