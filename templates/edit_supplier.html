{% extends 'base.html' %}

{% block content %}

<div class="page-header">
  <div class="page-header-title">
    <h1><i class="bi bi-pencil-square"></i> Edit Supplier</h1>
    <p>Update supplier information</p>
  </div>
</div>

<div class="card">
  <form method="POST" class="card-body">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label required">Name</label>
          <input type="text" class="form-control" id="name" name="name" value="{{ supplier.name }}" required>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label required">Contact</label>
          <input type="text" class="form-control" id="contact" name="contact" value="{{ supplier.contact }}" required>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label required">Address</label>
          <input type="text" class="form-control" id="address" name="address" value="{{ supplier.address }}" required>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label">Opening Balance</label>
          <input type="number" step="0.01" class="form-control" id="opening_balance" name="opening_balance" value="{{ supplier.opening_balance or 0 }}">
          <small class="form-text">Positive = amount owed to supplier | Negative = advance paid</small>
        </div>
      </div>
    </div>

    <div class="form-group mt-6 pt-6 border-top">
      <a href="{{ url_for('supplier_ledger', id=supplier.id) }}" class="btn btn-outline-primary mb-3">
        <i class="bi bi-journal-text"></i> View Full Ledger
      </a>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check"></i> Update Supplier
        </button>
        <a href="{{ url_for('supplier') }}" class="btn btn-secondary">
          <i class="bi bi-x"></i> Cancel
        </a>
      </div>
    </div>
  </form>
</div>

<script>
const EDIT_SUPPLIER_STORAGE_KEY = 'editSupplierFormData';
const SUPPLIER_ID = {{ supplier.id }};

function saveEditSupplierFormData() {
  const formData = {
    name: document.getElementById('name').value,
    contact: document.getElementById('contact').value,
    address: document.getElementById('address').value,
    opening_balance: document.getElementById('opening_balance').value,
  };
  localStorage.setItem(EDIT_SUPPLIER_STORAGE_KEY + '_' + SUPPLIER_ID, JSON.stringify(formData));
}

function restoreEditSupplierFormData() {
  const saved = localStorage.getItem(EDIT_SUPPLIER_STORAGE_KEY + '_' + SUPPLIER_ID);
  if (!saved) return;
  try {
    const formData = JSON.parse(saved);
    if (formData.name) document.getElementById('name').value = formData.name;
    if (formData.contact) document.getElementById('contact').value = formData.contact;
    if (formData.address) document.getElementById('address').value = formData.address;
    if (formData.opening_balance) document.getElementById('opening_balance').value = formData.opening_balance;
  } catch (e) {
    console.error('Failed to restore edit form data:', e);
  }
}

document.querySelector('form[method="POST"]').addEventListener('submit', function() {
  localStorage.removeItem(EDIT_SUPPLIER_STORAGE_KEY + '_' + SUPPLIER_ID);
});

['name', 'contact', 'address', 'opening_balance'].forEach(id => {
  const el = document.getElementById(id);
  if (el) {
    el.addEventListener('input', saveEditSupplierFormData);
    el.addEventListener('change', saveEditSupplierFormData);
  }
});

document.addEventListener('DOMContentLoaded', restoreEditSupplierFormData);
</script>

{% endblock %}
