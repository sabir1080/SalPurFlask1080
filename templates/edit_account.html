{% extends 'base.html' %}
{% block title %}Edit Account — {{ app_name }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-pencil-square text-dark"></i> Edit Account</h2>
    <a href="{{ url_for('accounts') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back to Accounts
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Account Name</label>
                        <input type="text" name="name" class="form-control" value="{{ acct.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Type</label>
                        <select name="account_type" class="form-select">
                            <option value="Cash" {% if acct.account_type == 'Cash' %}selected{% endif %}>Cash</option>
                            <option value="Bank" {% if acct.account_type == 'Bank' %}selected{% endif %}>Bank</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Opening Balance</label>
                        <input type="text" name="opening_balance" class="form-control" value="{{ acct.opening_balance | fmt_num }}">
                        <div class="form-text">Balance of this account before you started using the system.</div>
                    </div>
                    <div class="mb-2">
                        <span class="text-muted small">Tracks payment method:</span>
                        <code>{{ acct.method }}</code>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
