<!--edit_sale.html-->

{% extends 'base.html' %}
{% block content %}
{% set form_data = form_data|default({}) %}
    <h2>Edit Sale</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="customer_id" class="form-label">Customer</label>
            <select class="form-select" id="customer_id" name="customer_id" required>
                <option value="">Select Customer</option>
                {% for customer in customers %}
                    <option value="{{ customer.id }}" {% if (form_data.get('customer_id', sale.customer_id)|string) == (customer.id|string) %}selected{% endif %}>{{ customer.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="item_id" class="form-label">Item</label>
            <select class="form-select" id="item_id" name="item_id" required>
                <option value="">Select Item</option>
                {% for item in items %}
                    <option value="{{ item.id }}" {% if (form_data.get('item_id', sale.item_id)|string) == (item.id|string) %}selected{% endif %}>{{ item.name }}{% if item.id_category %} ({{ item.id_category.name }}){% endif %}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="quantity" name="quantity" value="{{ form_data.get('quantity', sale.quantity) }}" min="1" required>
        </div>
        <div class="mb-3">
            <label for="sale_price" class="form-label">Sale Price (per unit)</label>
            <input type="number" step="0.01" class="form-control" id="sale_price" name="sale_price" value="{{ form_data.get('sale_price', sale.sale_price) }}" required>
        </div>
        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" value="{{ form_data.get('date', sale.date.strftime('%Y-%m-%d')) }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Sale</button>
        <a href="{{ url_for('sale') }}" class="btn btn-secondary">Cancel</a>
    </form>
    <script>
        document.getElementById('item_id').addEventListener('change', function() {
            const itemId = this.value;
            if (itemId) {
                fetch(`/api/item/${itemId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.sale_price !== null) {
                            document.getElementById('sale_price').value = data.sale_price;
                        } else {
                            document.getElementById('sale_price').value = '';
                        }
                    });
            }
        });
    </script>
{% endblock %}
