

{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
{% set form_data = form_data|default({}) %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="my-4">Forgot Password</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ form_data.get('email', '') }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Send Reset Link</button>
        </form>
        <p class="mt-3"><a href="{{ url_for('auth.signin') }}">Back to Sign In</a></p>
    </div>
</div>
{% endblock %}
