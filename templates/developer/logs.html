{% extends "base.html" %}
{% block title %}Logs - Developer{% endblock %}
{% block content %}
<div class="container-fluid mt-4">
    <h2>📋 Application Logs</h2>

    <div class="mt-4">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Last 100 Log Lines</h5>
            </div>
            <div class="card-body log-container" style="max-height: 600px; overflow-y: auto; background: #1e1e1e; padding: 15px;">
                <div class="log-output" style="font-size: 1rem; font-family: 'Courier New', monospace; line-height: 2; letter-spacing: 0.5px;">
                    {% for line in logs %}
                        {% if is_html %}
                            {{ line|safe }}
                        {% else %}
                            <span style="color: #d4d4d4;">{{ line }}</span>
                        {% endif %}
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <a href="{{ url_for('developer.dashboard') }}" class="btn btn-primary mt-3">← Back</a>
</div>

<style>
    .log-container {
        background: #1e1e1e !important;
        border: 1px solid #333;
        padding: 15px !important;
    }

    .log-output {
        color: #d4d4d4;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: 'Courier New', 'Consolas', 'Monaco', monospace;
        font-size: 1rem !important;
        line-height: 2 !important;
        letter-spacing: 0.5px;
    }

    /* Ensure spans inside log-output are visible */
    .log-output span {
        display: block;
        margin: 0;
        padding: 2px 0;
    }

    /* Log level colors */
    .log-output span[style*="color: #ffc107"] {
        font-weight: 600;
        color: #ffc107 !important;
    }

    .log-output span[style*="color: #dc3545"] {
        font-weight: 600;
        color: #dc3545 !important;
    }

    .log-output span[style*="color: #17a2b8"] {
        font-weight: 500;
        color: #17a2b8 !important;
    }

    .log-output span[style*="color: #d4d4d4"] {
        color: #d4d4d4 !important;
    }

    /* Scrollbar styling */
    .log-container::-webkit-scrollbar {
        width: 10px;
    }

    .log-container::-webkit-scrollbar-track {
        background: #2d2d2d;
    }

    .log-container::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 4px;
    }

    .log-container::-webkit-scrollbar-thumb:hover {
        background: #777;
    }
</style>
{% endblock %}
