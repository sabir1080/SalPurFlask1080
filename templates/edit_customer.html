<!--edit_customer.html-->



{% extends 'base.html' %}

{% block content %}

    <h2>Edit Customer</h2>

    <form method="POST" class="mb-4">

        <div class="mb-3">

            <label for="name" class="form-label">Name</label>

            <input type="text" class="form-control" id="name" name="name" value="{{ customer.name }}" required>

        </div>

        <div class="mb-3">

            <label for="contact" class="form-label">Contact</label>

            <input type="text" class="form-control" id="contact" name="contact" value="{{ customer.contact }}" required>

        </div>

        <div class="mb-3">

            <label for="address" class="form-label">Address</label>

            <input type="text" class="form-control" id="address" name="address" value="{{ customer.address }}" required>

        </div>

        <div class="mb-3">

            <label for="opening_balance" class="form-label">Opening Balance</label>

            <input type="number" step="0.01" class="form-control" id="opening_balance" name="opening_balance" value="{{ customer.opening_balance or 0 }}">

            <small class="text-muted">Positive = receivable | Negative = advance received</small>

        </div>

        <a href="{{ url_for('customer_ledger', id=customer.id) }}" class="btn btn-info mb-3">View Full Ledger</a>

        <div>

            <button type="submit" class="btn btn-primary">Update Customer</button>

            <a href="{{ url_for('customer') }}" class="btn btn-secondary">Cancel</a>

        </div>

    </form>

<script>
// AUTO-SAVE EDIT FORM DATA TO localStorage
const EDIT_CUSTOMER_STORAGE_KEY = 'editCustomerFormData';
const CUSTOMER_ID = {{ customer.id }};

// Save form data whenever user types
function saveEditCustomerFormData() {
  const formData = {
    name: document.getElementById('name').value,
    contact: document.getElementById('contact').value,
    address: document.getElementById('address').value,
    opening_balance: document.getElementById('opening_balance').value,
  };
  localStorage.setItem(EDIT_CUSTOMER_STORAGE_KEY + '_' + CUSTOMER_ID, JSON.stringify(formData));
}

// Restore form data from localStorage on page load
function restoreEditCustomerFormData() {
  const saved = localStorage.getItem(EDIT_CUSTOMER_STORAGE_KEY + '_' + CUSTOMER_ID);
  if (!saved) return;

  try {
    const formData = JSON.parse(saved);
    if (formData.name) document.getElementById('name').value = formData.name;
    if (formData.contact) document.getElementById('contact').value = formData.contact;
    if (formData.address) document.getElementById('address').value = formData.address;
    if (formData.opening_balance) document.getElementById('opening_balance').value = formData.opening_balance;
  } catch (e) {
    console.error('Failed to restore edit form data:', e);
  }
}

// Clear saved data on successful submission
document.querySelector('form[method="POST"]').addEventListener('submit', function() {
  localStorage.removeItem(EDIT_CUSTOMER_STORAGE_KEY + '_' + CUSTOMER_ID);
});

// Add event listeners to all form inputs
['name', 'contact', 'address', 'opening_balance'].forEach(id => {
  const el = document.getElementById(id);
  if (el) {
    el.addEventListener('input', saveEditCustomerFormData);
    el.addEventListener('change', saveEditCustomerFormData);
  }
});

// Restore data when page loads
document.addEventListener('DOMContentLoaded', restoreEditCustomerFormData);
</script>

{% endblock %}
